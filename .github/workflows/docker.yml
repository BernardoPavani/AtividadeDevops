name: Pipeline DevSecOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Detecção de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarCloud - Análise Estática (SAST)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=BernardoPavani_AtividadeDevops
            -Dsonar.organization=bernardopavani

      - name: Build da Imagem Docker
        run: docker build -t ${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:1.0 .

      - name: Trivy - Análise de Vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:1.0'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Syft - Geração de SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:1.0
          artifact-name: sbom.spdx.json

      - name: Login no Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Push da Imagem Docker
        if: github.event_name == 'push'
        run: docker push ${{ secrets.REGISTRY_USERNAME }}/minha-aplicacao:1.0